<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:EB;src:url(eb-garamond-latin-400-normal.woff2)}
@font-face{font-family:EB;font-style:italic;src:url(eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:GM;src:url(GeistMono-Regular.ttf)}
html,body{margin:0;background:#000}
#p{position:relative;width:1080px;height:1350px;background:#0C0B0C;color:#FFFAF0;overflow:hidden}
#p::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,240,.04),rgba(0,0,0,0) 62%);pointer-events:none}
.gm{font-family:GM;font-size:18px;letter-spacing:.1em;text-transform:uppercase;line-height:1.7}
.eb{font-family:EB;text-wrap:balance}
i{font-style:italic}
.a{position:absolute}
.d{opacity:.5}
svg{position:absolute;left:0;top:0}
</style></head><body><div id="p"><svg id="s" width="1080" height="1350"></svg></div>
<script>
const Q=new URLSearchParams(location.search), DIR=Q.get('d')||'A', PG=+(Q.get('p')||1);
const L='#FFFAF0', B='#8FB8F2', M=96, W=1080, H=1350;
const spark=(x,y,r)=>{const k=r*0.14;return `<path d="M${x} ${y-r}Q${x+k} ${y-k} ${x+r} ${y}Q${x+k} ${y+k} ${x} ${y+r}Q${x-k} ${y+k} ${x-r} ${y}Q${x-k} ${y-k} ${x} ${y-r}Z" fill="${B}"/>`};
const E=(cx,cy,rx,ry,op=.8,rot=0,dash='')=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="none" stroke="${L}" stroke-width="1.1" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
const dot=(x,y,r,op=1)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${L}" opacity="${op}"/>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-family="${o.f||'GM'}" font-size="${o.s||16}" ${o.f?'':'letter-spacing="1.8"'} ${o.i?'font-style="italic"':''} fill="${L}" opacity="${o.op??.55}">${t}</text>`;
// ---------- forms: each drawn centred at (x,y) within radius r ----------
const F={
 vibration:(x,y,r)=>{let s='';for(let i=0;i<7;i++)s+=E(x-r*0.62+i*r*0.21,y,r*0.42,r*0.7,.3+i*0.09);return s+spark(x,y,r*0.07)},
 wave:(x,y,r)=>{const x0=x-r*2.2,x1=x+r*2.2;let d='';for(let i=0;i<=900;i++){const u=i/900;const a=r*0.32*(1-0.5*u);const ph=2*Math.PI*(1.5*u+Math.pow(u,3.4)*9);d+=(i?'L':'M')+(x0+(x1-x0)*u).toFixed(1)+' '+(y-a*Math.sin(ph)).toFixed(1)}
   return `<path d="${d}" fill="none" stroke="${L}" stroke-width="1.1" opacity=".85"/>`},
 hold:(x,y,r)=>E(x,y,r,r,.25,0,'2 8')+E(x,y,r*0.62,r*0.62,.55)+E(x,y,r*0.26,r*0.26,.9)+spark(x,y,r*0.08),
 grounding:(x,y,r)=>{let s='';for(let i=0;i<5;i++){const k=i/4;s+=E(x,y-r*0.55+k*r*1.1,r*(0.95-k*0.5),r*0.16*(1-k*0.4),.35+k*0.55)}return s},
 ties:(x,y,r)=>E(x-r*0.22,y,r*0.85,r*0.3,.85,35)+E(x+r*0.22,y,r*0.85,r*0.3,.85,-35),
 calm:(x,y,r)=>{let s='';for(let i=1;i<=5;i++)s+=E(x,y,r*0.2*i,r*0.2*i,.95-i*0.14);return s},
 clean:(x,y,r)=>E(x,y,r*0.8,r*0.8,.9)+spark(x,y-r*0.8,r*0.09),
 bounds:(x,y,r)=>E(x,y,r*0.95,r*0.95,.85)+E(x,y,r*0.78,r*0.78,.5,0,'3 6')+dot(x,y,r*0.06,.9),
 mind:(x,y,r)=>E(x,y,r*0.95,r*0.95,.3)+E(x,y,r*0.95,r*0.42,.85,0)+E(x,y,r*0.42,r*0.95,.55,0)+spark(x+r*0.95,y,r*0.08),
 together:(x,y,r)=>{let s='';for(let i=1;i<=4;i++){s+=E(x-r*0.55,y,r*0.22*i,r*0.22*i,.95-i*0.17)+E(x+r*0.55,y,r*0.22*i,r*0.22*i,.95-i*0.17)}return s+spark(x,y,r*0.08)},
 orbit:(x,y,r)=>E(x,y,r,r,.25,0,'2 8')+E(x,y,r*0.95,r*0.34,.85,-25)+E(x,y,r*0.95,r*0.34,.85,35)+E(x,y,r*0.95,r*0.34,.55,90)+spark(x,y,r*0.07),
 steps:(x,y,r)=>{let s='';const xs=[x-r*2,x,x+r*2];const fs=[F.hold,F.ties,F.calm];xs.forEach((cx,i)=>{s+=[(a,b,c)=>dot(a,b,c*0.1)+E(a,b,c*0.5,c*0.5,.8),(a,b,c)=>E(a,b,c*0.5,c*0.5,.8)+E(a,b,c*0.32,c*0.5,.5),(a,b,c)=>E(a,b,c*0.5,c*0.5,.5)+E(a,b,c*0.5,c*0.5,.9,0,'2 6')][i](cx,y,r*0.9)});return s},
};
// ---------- story (same in every direction) ----------
const S=[
 {label:'Waning moon · 3–8 Nov', title:'Everything<br>is <i>energy.</i>', sub:'Even a stone. Even your intention.', form:'vibration', note:'5 crystals for letting go', end:'Swipe →', cover:1},
 {label:'01 · The stone', title:'Press a quartz crystal and it answers with a tiny <i>electric charge.</i>', sub:'It’s called piezoelectricity. It’s how quartz keeps time in your watch, vibrating 32,768 times a second.', form:'wave', end:'Curie & Curie, 1880', marks:['still','pressed']},
 {label:'02 · The intention', title:'Your brain is 2% of your body, and uses 20% of its <i>energy.</i>', sub:'Every thought, every intention you hold, runs on that energy.', form:'mind', end:'Raichle & Gusnard, PNAS, 2002'},
 {label:'03 · Together', title:'Press the stone as you name your intention. It becomes a <i>cue</i> your mind returns to.', sub:'In 94 studies, people who tied a clear intention to a cue were far more likely to follow through.', form:'together', marks:['stone','intention'], end:'Gollwitzer & Sheeran, 2006'},
 {label:'04 · Five for the waning moon', title:'What each one is <i>for.</i>', sub:'Each stone holds a different intention. Notice which name stays with you.', grid:[['grounding','Smoky quartz','for grounding'],['ties','Obsidian','for old ties'],['calm','Amethyst','for a calm mind'],['clean','Selenite','for a clean slate'],['bounds','Black tourmaline','for boundaries']], end:'Share with a friend'},
 {label:'05 · How to hold it', title:'Hold it. Name what you release. <i>Breathe out.</i>', sub:'Then let it rest on your altar until the new moon on 9 November.', form:'steps', marks3:['hold','name','breathe out'], end:'Share with a friend'},
 {final:1, title:'Which one is <i>calling you?</i>', sub:'Trust the first stone your eye went to.', cta:'Save this for your altar.'},
];
const P=S[PG-1]; let svg='', html='', art_='', CEN=null;
const div=(st,cls,txt,id='')=>html+=`<div ${id?`id="${id}"`:''} class="a ${cls}" style="${st}">${txt}</div>`;
function marks(x0,x1,y){ if(P.form==='together'){return} if(P.marks){art_+=T(x0,y,P.marks[0].toUpperCase(),{a:'start',s:18})+T(x1,y,P.marks[1].toUpperCase(),{a:'end',s:18})} }
function grid(cx,cy,w,h,rr){ // 3 + 2 layout; whole block is centred later by measuring it
 const g=P.grid, r=rr||Math.min(w/3,h/2)*0.27, rows=[[0,1,2],[3,4]];
 rows.forEach((row,ri)=>{const y=cy+ri*(2*r+172); row.forEach((k,ci)=>{const n=row.length;const x=cx+(ci-(n-1)/2)*(w/3);
   art_+=F[g[k][0]](x,y,r); art_+=T(x,y+r+60,g[k][1],{f:'EB',s:38,op:1})+T(x,y+r+100,g[k][2],{f:'EB',s:28,i:1,op:.62});})});
}
function steps(cx,y,r){ art_+=F.steps(cx,y,r); P.marks3.forEach((m,i)=>art_+=T(cx+(i-1)*r*2,y+r*0.9*0.5+52,`0${i+1} · ${m.toUpperCase()}`,{s:18}))}
function art(x,y,r,box){ if(P.grid) return grid(box.cx,box.cy,box.w,box.h,box.r); if(P.form==='steps') return steps(x,y,r);
  art_+=F[P.form](x,y,r); if(P.form==='wave') marks(x-r*2.2,x+r*2.2,y+r*0.32+70); if(P.form==='together') art_+=T(x-r*0.55,y+r*0.88+56,'STONE',{s:18})+T(x+r*0.55,y+r*0.88+56,'INTENTION',{s:18}); }
// ---------- final page: a different room, so it reads as the end ----------
if(P.final){ document.getElementById('p').style.background='#3D374E';
 div(`top:0;bottom:250px;left:120px;right:120px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center`,'',
  `<div class="eb" style="font-size:104px;line-height:1.04">${P.title}</div>`+
  `<div class="eb" style="margin-top:44px;font-size:40px;line-height:1.35;opacity:.8">${P.sub}</div>`+
  `<div class="eb" style="margin-top:20px;font-size:40px;line-height:1.35"><i>${P.cta}</i></div>`);
 div(`bottom:96px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px`,'',
  `<img src="lune-logo-white.svg" alt="Lune" style="width:150px;height:auto;display:block">`+
  `<span class="gm" style="opacity:.6">lunerituals.app</span>`);
}
// ---------- three layout logics ----------
if(DIR==='A'&&!P.final){ // EMBLEM: everything centred; form above, words below
 div(`top:${M}px;left:0;right:0;text-align:center`,'gm d',P.label);
 const big=P.cover?112:74, ty=P.cover?800:(P.grid?190:760);
 if(P.grid){div(`top:${ty}px;left:0;right:0;text-align:center;font-size:${big}px;line-height:1.05`,'eb',P.title); art(0,0,0,{cx:540,cy:760,w:900,h:760}); CEN=[540,(300+1200)/2];}
 else { CEN=[540,(150+ty)/2]; art(540,P.cover?480:440,P.form==='wave'?180:(P.form==='steps'?120:150));
  div(`top:${ty}px;left:120px;right:120px;text-align:center;font-size:${big}px;line-height:1.06`,'eb',P.title);
  if(P.sub) div(`top:${P.cover?1052:ty+ (P.title.length>60?250:180)}px;left:150px;right:150px;text-align:center;font-size:${P.cover?40:34}px;line-height:1.35;opacity:.72`,'eb',P.cover?'<i>'+P.sub+'</i>':P.sub);}
 div(`top:1230px;left:${M}px`,'gm d','Lune'); div(`top:1230px;right:${M}px`,'gm d',P.cover?P.note+' →':P.end);
}
if(DIR==='B'&&!P.final){ // GRID: thin frame; title cell + note cell; art lives in the big cell
 const x0=M,x1=W-M,y0=120,y1=1180,ym=P.cover?470:500,xm=W/2+16;
 svg+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none" stroke="${L}" stroke-width="1" opacity=".26"/><line x1="${x0}" y1="${ym}" x2="${x1}" y2="${ym}" stroke="${L}" stroke-width="1" opacity=".26"/><line x1="${xm}" y1="${y0}" x2="${xm}" y2="${ym}" stroke="${L}" stroke-width="1" opacity=".26"/>`;
 div(`top:${y0+40}px;left:${x0+40}px`,'gm d',P.label,'bl');
 const big=P.cover?86:(P.title.length>60?48:56);
 div(`top:${y0+92}px;left:${x0+40}px;width:${xm-x0-80}px;font-size:${big}px;line-height:1.08`,'eb',P.title,'bt'); window.CELL={y0,ym};
 const right=P.cover?'Even a stone. 5 crystals to hold while you let go this waning moon.':(P.sub||'');
 div(`top:${y0+44}px;left:${xm+40}px;width:${x1-xm-80}px;font-size:${P.sub&&!P.cover?30:30}px;line-height:1.35;opacity:.8`,'eb',right,'bn');
 CEN=[540,(ym+y1)/2]; if(P.grid) art(0,0,0,{cx:540,cy:(ym+y1)/2-6,w:840,h:600,r:63}); else art(540,(ym+y1)/2,P.form==='wave'?175:(P.form==='steps'?120:150));
 div(`top:1220px;left:${M}px`,'gm d','Lune'); div(`top:1220px;right:${M}px`,'gm d',P.cover?'Swipe →':P.end);
}
if(DIR==='C'&&!P.final){ // EDITORIAL: big left title on top, small art low right, quiet notes low left
 div(`top:${M}px;left:${M}px`,'gm d',P.label);
 const big=P.cover?124:(P.title.length>60?70:84);
 div(`top:${M+64}px;left:${M}px;width:${P.cover?880:860}px;font-size:${big}px;line-height:1.04`,'eb',P.title);
 if(P.sub) div(`top:${P.cover?450:(P.title.length>60?470:390)}px;left:${M}px;width:${P.cover?600:640}px;font-size:${P.cover?40:34}px;line-height:1.35;opacity:.72`,'eb',P.sub);
 if(P.grid){ art(0,0,0,{cx:540,cy:880,w:900,h:620}); CEN=[540,(500+1200)/2];}
 else if(P.form==='wave') art(540,880,175); else if(P.form==='steps') art(540,900,120); else art(760,900,P.cover?170:150);
 if(P.cover) div(`top:1186px;left:${M}px`,'gm d','5 crystals<br>for letting go');
 else div(`top:1230px;left:${M}px`,'gm d',P.end);
 div(`top:1230px;right:${M}px`,'gm d',P.cover?'Swipe →':'Lune');
}
document.getElementById('s').innerHTML=svg+`<g id="art">${art_}</g>`;
if(CEN){const g=document.getElementById('art');const b=g.getBBox();if(b.width){g.setAttribute('transform',`translate(${(CEN[0]-(b.x+b.width/2)).toFixed(1)} ${(CEN[1]-(b.y+b.height/2)).toFixed(1)})`)}} document.getElementById('p').insertAdjacentHTML('beforeend',html);
if(window.CELL){const l=document.getElementById('bl'),t=document.getElementById('bt'),n=document.getElementById('bn');
 const gap=28, lh=l.offsetHeight, th=t.offsetHeight, blk=lh+gap+th, top=(CELL.y0+CELL.ym)/2-blk/2+(+(Q.get('dy')||0));
 l.style.top=top+'px'; t.style.top=(top+lh+gap)+'px'; if(n){n.style.top=(top+lh+gap+ (n.offsetHeight<th? 0:0))+'px'; const nb=top+lh+gap+n.offsetHeight; if(n.offsetHeight>th){}}}

</script></body></html>
