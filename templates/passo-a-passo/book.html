<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(GeistMono-Regular.ttf)}
@font-face{font-family:E;src:url(eb-garamond-latin-400-normal.woff2)}@font-face{font-family:E;font-style:italic;src:url(eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:H;src:url(reenie-beanie-latin-400-normal.woff2)}
@font-face{font-family:C;src:url(caveat-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#F4EFE6;color:#2A2622}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.35),rgba(120,100,70,.10));pointer-events:none}
.run{position:absolute;top:110px;left:0;right:0;text-align:center;font-family:M;font-size:20px;letter-spacing:6px;color:rgba(42,38,34,.55)}
.pg{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-family:E;font-size:30px;color:rgba(42,38,34,.55)}
.foot{position:absolute;bottom:70px;right:110px;font-family:M;font-size:18px;letter-spacing:3px;color:rgba(42,38,34,.45)}
.wrap{position:absolute;inset:220px 140px 220px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:E;font-weight:400;font-size:88px;line-height:1.08}
p{font-family:E;font-size:46px;line-height:1.45;margin-bottom:28px}
.lab{font-family:M;font-size:22px;letter-spacing:4px;color:rgba(42,38,34,.6);margin-bottom:28px}
.row{font-family:E;font-size:46px;line-height:1.35;margin-bottom:26px;display:flex;gap:22px;align-items:baseline}
.row .n{font-family:M;font-size:22px;color:rgba(42,38,34,.55)}
.hand{position:absolute;font-family:H;font-size:58px;color:#4a4642;line-height:1;white-space:nowrap}
.cav{font-family:C;font-size:44px}
svg.sk{position:absolute;inset:0;width:1080px;height:1350px;pointer-events:none}
.sk path,.sk circle,.sk line{fill:none;stroke:#3f3b37;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.src{font-family:M;font-size:18px;letter-spacing:2px;color:rgba(42,38,34,.5)}
.logo{width:110px;filter:invert(1) brightness(.25);margin-bottom:30px}

.u{text-decoration:underline;text-decoration-color:#2747A8;text-decoration-thickness:2.6px;text-underline-offset:9px}
.c{position:relative;white-space:nowrap;margin:0 8px}.c:after{content:"";position:absolute;inset:-8px -20px -6px -18px;border:2.6px solid #2747A8;border-radius:50% 46% 52% 48%;transform:rotate(-1.5deg);filter:url(#pc);opacity:.9}
.br{border-left:2.6px solid #2747A8;padding-left:22px;margin-left:-26px;filter:none}
.pen{position:absolute;font-family:C;font-size:46px;color:#2747A8;line-height:1.05;white-space:nowrap}
.pen.v{transform-origin:left top}
.hand{display:none}
.sk path,.sk circle,.sk line{stroke:#2747A8 !important;opacity:.85 !important;stroke-width:2.6 !important}
@font-face{font-family:'homemade-apple';src:url(homemade-apple-latin-400-normal.woff2)}@font-face{font-family:'la-belle-aurore';src:url(la-belle-aurore-latin-400-normal.woff2)}@font-face{font-family:'nothing-you-could-do';src:url(nothing-you-could-do-latin-400-normal.woff2)}@font-face{font-family:'cedarville-cursive';src:url(cedarville-cursive-latin-400-normal.woff2)}@font-face{font-family:'zeyada';src:url(zeyada-latin-400-normal.woff2)}
.pen{font-family:'homemade-apple'!important;font-size:36px!important;line-height:1.5!important}</style></head><body><div class="run">YOUR SKY · LUNE</div><div id="root"></div><svg class="sk" id="sk"><defs><filter id="pc"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs><g id="g" filter="url(#pc)"></g></svg><div class="pg" id="pg"></div>
<script>
let seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
function wob(cx,cy,R,turn=1.08,j=.035){let d='',n=60;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2*turn-0.4;const rr=R*(1+(r()-.5)*j*2);d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)*0.98).toFixed(1)}return `<path d="${d}"/>`}
function line(x1,y1,x2,y2,j=3){let d=`M${x1} ${y1}`;const n=8;for(let i=1;i<=n;i++){const t=i/n;d+=` L${(x1+(x2-x1)*t+(r()-.5)*j).toFixed(1)} ${(y1+(y2-y1)*t+(r()-.5)*j).toFixed(1)}`}return `<path d="${d}"/>`}
function arrow(x1,y1,x2,y2,cx,cy){const a=Math.atan2(y2-cy,x2-cx);const h=22;return `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}"/>`+line(x2,y2,x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45),1)+line(x2,y2,x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45),1)}
function hatch(cx,cy,R,frac,side){let s='';for(let y=-R+6;y<R-4;y+=7){const w=Math.sqrt(R*R-y*y);const x0=side<0?cx-w:cx+w-2*w*frac;const x1=side<0?cx-w+2*w*frac:cx+w;s+=line(x0+3,cy+y,x1-3,cy+y+2,1.2)}return s}
function moon(cx,cy,R,frac,side){return wob(cx,cy,R,1.04,.03)+(frac>0?hatch(cx,cy,R,frac,side):'')}
function star(x,y,s){return line(x-s,y,x+s,y,1)+line(x,y-s,x,y+s,1)}
function wave(x,y,w,amp){let d=`M${x} ${y}`;for(let i=1;i<=40;i++){const t=i/40;d+=` L${(x+w*t).toFixed(1)} ${(y+Math.sin(t*Math.PI*3)*amp*(0.6+0.4*Math.sin(t*5))+ (r()-.5)*2).toFixed(1)}`}return `<path d="${d}"/>`}
const P=[
{h:`<div class="wrap"><h1>Why you feel <i>different</i> every few days</h1><p style="margin-top:40px">and what the moon has to do with it.</p></div><div class="pen" style="left:150px;top:1040px;transform:rotate(-3deg)">a page for everyone who thought it was "just me"...</div>`,
 s:()=>{let s='';const xs=[260,390,520,650,780];const f=[1,.6,0,.6,1];xs.forEach((x,i)=>s+=moon(x,330,40,f[i]*0.5,i<2?1:-1));s+=arrow(250,405,780,405,515,440);return s}},
{h:`<div class="wrap"><div class="lab">WHAT'S ACTUALLY HAPPENING?</div><p>Ever woken up <span class="c">calm</span>, and two days later felt <span class="c">restless</span>, with <span class="u">nothing in your life changing?</span></p><p>You blame the weather, the coffee, yourself. Most of all, yourself.</p></div><div class="pen" style="left:140px;top:1060px;transform:rotate(-2deg)">me. every. month.</div><div class="pen v" style="left:1000px;top:400px;transform:rotate(90deg)">be gentle, it's not a flaw →</div>`,
 s:()=>''},
{h:`<div class="wrap"><div class="lab">THE MOON IS MOVING</div><p>Every month the moon passes through <span class="c">all twelve signs</span>, about <span class="u">two and a half days in each.</span></p><p>So the sky above you is never the same for long, and neither is the mood it brings.</p></div><div class="pen" style="left:600px;top:300px;transform:rotate(-4deg)">~2½ days per sign</div>`,
 s:()=>{let s=wob(400,330,110,1.03,.02)+wob(400,330,80,1.03,.02);for(let k=0;k<12;k++){const a=k/12*Math.PI*2;s+=line(400+80*Math.cos(a),330+80*Math.sin(a),400+110*Math.cos(a),330+110*Math.sin(a),1)}s+=moon(400+95*Math.cos(-.9),330+95*Math.sin(-.9),11,.5,1);s+=arrow(590,320,520,310,555,290);return s}},
{h:`<div class="wrap"><div class="lab">EACH SIGN HAS A MOOD</div><p>In astrology, the sign the moon is in <span class="u">colours the mood</span> of those days.</p><div class="br"><div class="row"><span class="n">♋︎</span>Cancer days feel tender.</div><div class="row"><span class="n">♈︎</span>Aries days feel restless.</div><div class="row"><span class="n">♉︎</span>Taurus days ask for comfort.</div><div class="row" style="margin-bottom:0"><span class="n">♓︎</span>Pisces days feel dreamy.</div></div></div><div class="pen" style="left:610px;top:1075px;transform:rotate(-4deg)">which one is today?</div>`,
 s:()=>''},
{h:`<div class="wrap"><div class="lab">YOUR OWN MOON</div><p>You also have a <span class="c">Moon sign</span>: where the moon was when you were born. It shows <span class="u">how you feel, and what helps you feel safe.</span></p><p>When the moon returns to it, your feelings come <span class="u">closer to the surface.</span></p></div><div class="pen" style="left:560px;top:300px;transform:rotate(-5deg)">you need your birth time!</div><div class="pen v" style="left:1000px;top:560px;transform:rotate(90deg)">that's why some days hit harder ↓</div>`,
 s:()=>arrow(650,350,520,470,560,390)},
{h:`<div class="wrap"><div class="lab">YOUR MIND IS PART OF IT</div><p>The brain <span class="c">notices</span> what it's looking for.</p><p>When you know the energy of the day, you meet it <span class="u">with care instead of blaming yourself.</span></p><div class="src">SELECTIVE ATTENTION · SIMONS &amp; CHABRIS, 1999</div></div><div class="pen" style="left:150px;top:1060px;transform:rotate(-3deg)">knowing is a kind of kindness ♡</div>`,
 s:()=>''},
{h:`<div class="wrap"><div class="lab">HOW TO USE IT</div><div class="row"><span class="n">01</span><span class="u">Find your Moon sign.</span></div><div class="row"><span class="n">02</span>Check which sign the moon is in today.</div><div class="row"><span class="n">03</span>Choose <span class="c">one small</span>&nbsp;ritual for that energy.</div></div><div class="pen" style="left:150px;top:1050px;transform:rotate(-3deg)">three small steps. that's it.</div><div class="pen" style="left:600px;top:520px;transform:rotate(-6deg)">start here ↓</div>`,
 s:()=>''},
{h:`<div class="wrap" style="align-items:center;text-align:center"><img class="logo" src="lune-logo-white.svg"><h1 style="font-size:84px">Your sky is the <i>reading.</i></h1><p style="margin-top:36px">Lune: Moon Rituals does <span class="u">steps 2 and 3 for you.</span> It reads your sky and builds a ritual for each moon.</p><div class="lab" style="margin-top:10px">JOIN THE WAITLIST · LINK IN BIO</div></div><div class="pen" style="left:620px;top:1080px;transform:rotate(-5deg)">see you there ☾</div>`,
 s:()=>''}
];
function render(i){seed=11+i*17;document.getElementById('root').innerHTML=P[i].h;document.getElementById('g').innerHTML=P[i].s();document.getElementById('pg').textContent=(i+1)}
</script></body></html>
