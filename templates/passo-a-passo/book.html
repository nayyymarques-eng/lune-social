<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(GeistMono-Regular.ttf)}
@font-face{font-family:E;src:url(eb-garamond-latin-400-normal.woff2)}@font-face{font-family:E;font-style:italic;src:url(eb-garamond-latin-400-italic.woff2)}
@font-face{font-family:H;src:url(reenie-beanie-latin-400-normal.woff2)}
@font-face{font-family:C;src:url(caveat-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;background:#F4EFE6;color:#2A2622}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.35),rgba(120,100,70,.10));pointer-events:none}
.run{position:absolute;top:110px;left:0;right:0;text-align:center;font-family:M;font-size:20px;letter-spacing:6px;color:rgba(42,38,34,.55)}
.pg{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-family:E;font-size:30px;color:rgba(42,38,34,.55)}
.foot{position:absolute;bottom:70px;right:110px;font-family:M;font-size:18px;letter-spacing:3px;color:rgba(42,38,34,.45)}
.wrap{position:absolute;inset:220px 140px 220px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:E;font-weight:400;font-size:88px;line-height:1.08}
p{font-family:E;font-size:46px;line-height:1.45;margin-bottom:28px}
.lab{font-family:M;font-size:22px;letter-spacing:4px;color:rgba(42,38,34,.6);margin-bottom:28px}
.row{font-family:E;font-size:46px;line-height:1.35;margin-bottom:26px;display:flex;gap:22px;align-items:baseline}
.row .n{font-family:M;font-size:22px;color:rgba(42,38,34,.55)}
.hand{position:absolute;font-family:H;font-size:58px;color:#4a4642;line-height:1;white-space:nowrap}
.cav{font-family:C;font-size:44px}
svg.sk{position:absolute;inset:0;width:1080px;height:1350px;pointer-events:none}
.sk path,.sk circle,.sk line{fill:none;stroke:#3f3b37;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
.src{font-family:M;font-size:18px;letter-spacing:2px;color:rgba(42,38,34,.5)}
.logo{width:110px;filter:invert(1) brightness(.25);margin-bottom:30px}
</style></head><body><div class="run">YOUR SKY · LUNE</div><div id="root"></div><svg class="sk" id="sk"><defs><filter id="pc"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter></defs><g id="g" filter="url(#pc)"></g></svg><div class="pg" id="pg"></div>
<script>
let seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
function wob(cx,cy,R,turn=1.08,j=.035){let d='',n=60;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2*turn-0.4;const rr=R*(1+(r()-.5)*j*2);d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)*0.98).toFixed(1)}return `<path d="${d}"/>`}
function line(x1,y1,x2,y2,j=3){let d=`M${x1} ${y1}`;const n=8;for(let i=1;i<=n;i++){const t=i/n;d+=` L${(x1+(x2-x1)*t+(r()-.5)*j).toFixed(1)} ${(y1+(y2-y1)*t+(r()-.5)*j).toFixed(1)}`}return `<path d="${d}"/>`}
function arrow(x1,y1,x2,y2,cx,cy){const a=Math.atan2(y2-cy,x2-cx);const h=22;return `<path d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}"/>`+line(x2,y2,x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45),1)+line(x2,y2,x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45),1)}
function hatch(cx,cy,R,frac,side){let s='';for(let y=-R+6;y<R-4;y+=7){const w=Math.sqrt(R*R-y*y);const x0=side<0?cx-w:cx+w-2*w*frac;const x1=side<0?cx-w+2*w*frac:cx+w;s+=line(x0+3,cy+y,x1-3,cy+y+2,1.2)}return s}
function moon(cx,cy,R,frac,side){return wob(cx,cy,R,1.04,.03)+(frac>0?hatch(cx,cy,R,frac,side):'')}
function star(x,y,s){return line(x-s,y,x+s,y,1)+line(x,y-s,x,y+s,1)}
function wave(x,y,w,amp){let d=`M${x} ${y}`;for(let i=1;i<=40;i++){const t=i/40;d+=` L${(x+w*t).toFixed(1)} ${(y+Math.sin(t*Math.PI*3)*amp*(0.6+0.4*Math.sin(t*5))+ (r()-.5)*2).toFixed(1)}`}return `<path d="${d}"/>`}
const P=[
{h:`<div class="wrap"><h1>Why you feel <i>different</i> every few days</h1><p style="margin-top:40px">and what the moon has to do with it.</p></div><div class="hand" style="left:600px;top:1010px;transform:rotate(-5deg)">it's not just you ♡</div>`,
 s:()=>{let s='';const xs=[260,390,520,650,780];const f=[1,.6,0,.6,1];xs.forEach((x,i)=>s+=moon(x,300,40,f[i]*0.5+(i==2?0:0),i<2?1:-1));s+=arrow(250,375,780,375,515,410);s+=star(880,250,12)+star(180,420,8);return s}},
{h:`<div class="wrap"><div class="lab">WHAT'S ACTUALLY HAPPENING?</div><p>Ever woken up calm, and two days later felt restless, with nothing in your life changing?</p></div><div class="hand" style="left:560px;top:1000px;transform:rotate(-4deg)">me, every month.</div>`,
 s:()=>wave(150,930,780,38)+line(150,990,930,990,2)+`<g>${star(250,880,7)}</g>`},
{h:`<div class="wrap" style="inset:560px 140px 220px;justify-content:flex-start"><div class="lab">THE MOON IS MOVING</div><p>Every month the moon passes through all twelve signs, about two and a half days in each.</p></div><div class="hand" style="left:690px;top:300px;transform:rotate(6deg)">~2½ days<br>per sign</div>`,
 s:()=>{let s=wob(420,360,150,1.03,.02)+wob(420,360,108,1.03,.02);for(let k=0;k<12;k++){const a=k/12*Math.PI*2;s+=line(420+108*Math.cos(a),360+108*Math.sin(a),420+150*Math.cos(a),360+150*Math.sin(a),1)}s+=moon(420+129*Math.cos(-.9),360+129*Math.sin(-.9),13,.5,1);s+=arrow(680,330,560,300,620,280);return s}},
{h:`<div class="wrap"><div class="lab">EACH SIGN HAS A MOOD</div><p>In astrology, the sign the moon is in colours the mood of those days.</p><div class="row"><span class="n">♋︎</span>Cancer days feel tender.</div><div class="row"><span class="n">♈︎</span>Aries days feel restless.</div><div class="row"><span class="n">♉︎</span>Taurus days ask for comfort.</div><div class="row"><span class="n">♓︎</span>Pisces days feel dreamy.</div></div><div class="hand" style="left:600px;top:1085px;transform:rotate(-5deg)">which one is today?</div>`,
 s:()=>arrow(590,1100,470,1050,510,1100)},
{h:`<div class="wrap"><div class="lab">YOUR OWN MOON</div><p>You also have a Moon sign: where the moon was when you were born. It shows how you feel, and what helps you feel safe.</p><p>When the moon returns to it, your feelings come closer to the surface.</p></div><div class="hand" style="left:610px;top:290px;transform:rotate(-6deg)">you need your<br>birth time!</div>`,
 s:()=>moon(330,330,62,.62,1)+star(450,270,9)+arrow(600,330,420,335,510,300)},
{h:`<div class="wrap"><div class="lab">YOUR MIND IS PART OF IT</div><p>The brain notices what it's looking for. When you know the energy of the day, you meet it with care instead of blaming yourself.</p><div class="src">SELECTIVE ATTENTION · SIMONS &amp; CHABRIS, 1999</div></div><div class="hand" style="left:180px;top:1050px;transform:rotate(-3deg)">be kind to you ♡</div>`,
 s:()=>{let s=`<path d="M440 330 Q540 250 640 330 Q540 410 440 330"/>`+wob(540,330,34,1.05,.04)+hatch(540,330,16,1,1);for(let k=0;k<7;k++){const a=-Math.PI*0.15-k*Math.PI*0.7/6;s+=line(540+70*Math.cos(a),300+70*Math.sin(a),540+92*Math.cos(a),300+92*Math.sin(a),1)}return s}},
{h:`<div class="wrap"><div class="lab">HOW TO USE IT</div><div class="row"><span class="n">01</span>Find your Moon sign.</div><div class="row"><span class="n">02</span>Check which sign the moon is in today.</div><div class="row"><span class="n">03</span>Choose one small ritual for that energy.</div></div><div class="hand" style="left:200px;top:1040px;transform:rotate(-3deg)">three small steps. that's it.</div>`,
 s:()=>moon(540,320,48,.3,-1)+star(650,270,9)+star(430,380,7)},
{h:`<div class="wrap" style="align-items:center;text-align:center"><img class="logo" src="lune-logo-white.svg"><h1 style="font-size:84px">Your sky is the <i>reading.</i></h1><p style="margin-top:36px">Lune: Moon Rituals does steps 2 and 3 for you. It reads your sky and builds a ritual for each moon.</p><div class="lab" style="margin-top:10px">JOIN THE WAITLIST · LINK IN BIO</div></div><div class="hand" style="left:650px;top:1070px;transform:rotate(-5deg)">see you there ☾</div>`,
 s:()=>star(250,330,12)+star(840,300,9)+star(860,960,7)}
];
function render(i){seed=11+i*17;document.getElementById('root').innerHTML=P[i].h;document.getElementById('g').innerHTML=P[i].s();document.getElementById('pg').textContent=(i+1)}
</script></body></html>
